[package]
name = "shike-alarm"
version = "0.1.7"
description = "Shike alarm clock and countdown desktop app"
authors = ["yao-Hub"]
edition = "2021"

[lib]
name = "shike_alarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
